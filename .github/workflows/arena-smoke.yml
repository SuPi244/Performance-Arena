name: Arena production smoke audit

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/scripts/arena-smoke.mjs"
      - ".github/workflows/arena-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Audit deployed Arena
        run: node .github/scripts/arena-smoke.mjs
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-production-smoke
          path: arena-audit-artifacts
          retention-days: 7
